# Catppuccin Mocha — Alacritty

[font]
size = 12.0

[font.normal]
family = "JetBrains Mono Nerd Font"
style  = "Regular"

[font.bold]
family = "JetBrains Mono Nerd Font"
style  = "Bold"

[font.italic]
family = "JetBrains Mono Nerd Font"
style  = "Italic"

[window]
padding           = { x = 12, y = 10 }
decorations       = "none"
opacity           = 0.92
dynamic_title     = true
startup_mode      = "Windowed"

[scrolling]
history = 10000

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.cursor]
text   = "#1e1e2e"
cursor = "#f5e0dc"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"

[[keyboard.bindings]]
key     = "Return"
mods    = "Control|Shift"
action  = "SpawnNewInstance"

[[keyboard.bindings]]
key     = "C"
mods    = "Control|Shift"
action  = "Copy"

[[keyboard.bindings]]
key     = "V"
mods    = "Control|Shift"
action  = "Paste"
