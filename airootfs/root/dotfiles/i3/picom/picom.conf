# ── Picom — compositeur pour i3 ───────────────────────────────

# Backend
backend          = "glx"
glx-no-stencil   = true
vsync            = true

# Ombres
shadow           = true
shadow-radius    = 18
shadow-offset-x  = -14
shadow-offset-y  = -14
shadow-opacity   = 0.5
shadow-exclude   = [
    "name = 'Notification'",
    "class_g = 'Polybar'",
    "class_g = 'Dunst'",
    "_GTK_FRAME_EXTENTS@:c"
]

# Fondu
fading           = true
fade-delta       = 8
fade-in-step     = 0.05
fade-out-step    = 0.05
fade-exclude     = []

# Opacité
inactive-opacity = 0.88
active-opacity   = 1.0
frame-opacity    = 0.95
inactive-opacity-override = false

opacity-rule = [
    "100:class_g = 'firefox'",
    "100:class_g = 'vlc'",
    "90:class_g = 'Alacritty'",
    "90:class_g = 'Code'"
]

# Blur
blur-method      = "dual_kawase"
blur-strength    = 7
blur-background  = true
blur-background-frame = false
blur-background-fixed = false
blur-kern        = "3x3box"
blur-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'"
]

# Coins arrondis
corner-radius    = 12
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'"
]

# Perf
use-damage       = true
log-level        = "warn"
