[colors]
base     = #1e1e2e
mantle   = #181825
surface0 = #313244
surface1 = #45475a
text     = #cdd6f4
subtext0 = #a6adc8
blue     = #89b4fa
mauve    = #cba6f7
red      = #f38ba8
green    = #a6e3a1
yellow   = #f9e2af
peach    = #fab387
teal     = #94e2d5
sapphire = #74c7ec
sky      = #89dceb
transparent = #00000000

[bar/main]
monitor = ${env:MONITOR:}
width    = 100%
height   = 34
offset-x = 0
offset-y = 0
radius   = 0

background = ${colors.base}
foreground = ${colors.text}

border-size   = 0
border-color  = ${colors.surface1}

padding-left  = 2
padding-right = 2
module-margin = 1

separator     = |
separator-foreground = ${colors.surface1}

font-0 = "JetBrains Mono Nerd Font:size=11:weight=bold;2"
font-1 = "JetBrains Mono Nerd Font:size=14;3"
font-2 = "Noto Color Emoji:scale=10;2"

modules-left   = i3 xwindow
modules-center = date
modules-right  = pulseaudio bluetooth network cpu memory battery temperature powermenu

tray-position = right
tray-padding  = 4
tray-background = ${colors.base}

cursor-click = pointer

[module/i3]
type             = internal/i3
pin-workspaces   = true
strip-wsnumbers  = false
index-sort       = true
enable-click     = true
enable-scroll    = true
wrapping-scroll  = false
reverse-scroll   = false

format              = <label-state> <label-mode>
label-mode          = %mode%
label-mode-padding  = 6
label-mode-background = ${colors.red}
label-mode-foreground = ${colors.base}

label-focused            = %index%: %icon%
label-focused-foreground = ${colors.base}
label-focused-background = ${colors.mauve}
label-focused-underline  = ${colors.blue}
label-focused-padding    = 6

label-unfocused            = %index%: %icon%
label-unfocused-foreground = ${colors.subtext0}
label-unfocused-padding    = 6

label-visible            = %index%: %icon%
label-visible-foreground = ${colors.blue}
label-visible-padding    = 6

label-urgent            = %index%: %icon%
label-urgent-foreground = ${colors.base}
label-urgent-background = ${colors.red}
label-urgent-padding    = 6

ws-icon-0 = 1;󰈹
ws-icon-1 = 2;󰨞
ws-icon-2 = 3;
ws-icon-3 = 4;󰙪
ws-icon-4 = 5;
ws-icon-5 = 6;
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-8 = 9;󰒃

[module/xwindow]
type             = internal/xwindow
label            = %title:0:50:...%
label-foreground = ${colors.subtext0}

[module/date]
type     = internal/date
interval = 30
date     = %A %d %B
time     = %H:%M
format-prefix     = "  "
format-prefix-foreground = ${colors.mauve}
format-foreground = ${colors.text}
label = %date%  %time%

[module/pulseaudio]
type              = internal/pulseaudio
use-ui-max        = true
interval          = 5
format-volume     = <ramp-volume> <label-volume>
format-muted-prefix     = " 󰝟 "
format-muted-prefix-foreground = ${colors.subtext0}
label-volume      = %percentage%%
label-volume-foreground = ${colors.lavender}
label-muted       = muet
label-muted-foreground = ${colors.surface1}
ramp-volume-0     = 󰕿
ramp-volume-1     = 󰖀
ramp-volume-2     = 󰕾
ramp-volume-foreground = ${colors.mauve}
click-right       = pavucontrol

[module/bluetooth]
type = custom/script
exec = bluetoothctl show | grep -q "Powered: yes" && echo "  " || echo "  "
interval = 10
format-foreground = ${colors.sky}
click-left = blueman-manager

[module/network]
type              = internal/network
interface-type    = wireless
interval          = 5
format-connected  = <ramp-signal> <label-connected>
format-disconnected = <label-disconnected>
label-connected   = %essid% %downspeed:8%
label-connected-foreground = ${colors.sapphire}
label-disconnected         = 󰖪 hors ligne
label-disconnected-foreground = ${colors.red}
ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
ramp-signal-foreground = ${colors.sapphire}

[module/cpu]
type              = internal/cpu
interval          = 3
format-prefix     = "  "
format-prefix-foreground = ${colors.peach}
label             = %percentage%%
label-foreground  = ${colors.text}

[module/memory]
type              = internal/memory
interval          = 5
format-prefix     = "  "
format-prefix-foreground = ${colors.blue}
label             = %percentage_used%%
label-foreground  = ${colors.text}

[module/battery]
type              = internal/battery
battery           = BAT0
adapter           = AC
full-at           = 98
low-at            = 15
interval          = 30

format-charging      = <animation-charging> <label-charging>
format-discharging   = <ramp-capacity> <label-discharging>
format-full-prefix   = "󰚥 "
format-full-prefix-foreground = ${colors.green}

label-charging    = %percentage%%
label-charging-foreground = ${colors.teal}
label-discharging = %percentage%%
label-full        = plein

ramp-capacity-0   = 󰁺
ramp-capacity-1   = 󰁻
ramp-capacity-2   = 󰁼
ramp-capacity-3   = 󰁾
ramp-capacity-4   = 󰂀
ramp-capacity-5   = 󰁹
ramp-capacity-foreground = ${colors.green}

animation-charging-0  = 󰂆
animation-charging-1  = 󰂇
animation-charging-2  = 󰂈
animation-charging-framerate = 750
animation-charging-foreground = ${colors.yellow}

[module/temperature]
type              = internal/temperature
thermal-zone      = 0
warn-temperature  = 80
interval          = 5
format            = <ramp> <label>
format-warn       = <ramp> <label-warn>
label             = %temperature-c%
label-foreground  = ${colors.text}
label-warn        = %temperature-c%
label-warn-foreground = ${colors.red}
ramp-0            =
ramp-1            =
ramp-2            =
ramp-foreground   = ${colors.yellow}

[module/powermenu]
type            = custom/menu
expand-right    = false
format-spacing  = 2
label-open      = ⏻
label-open-foreground = ${colors.red}
label-close     = ✕ annuler
label-close-foreground = ${colors.subtext0}
label-separator = |
label-separator-foreground = ${colors.surface1}

menu-0-0          = 󰐥 éteindre
menu-0-0-exec     = systemctl poweroff
menu-0-1          = 󰜉 redémarrer
menu-0-1-exec     = systemctl reboot
menu-0-2          = 󰒲 suspendre
menu-0-2-exec     = systemctl suspend
menu-0-3          = 󰿅 déconnecter
menu-0-3-exec     = i3-msg exit
