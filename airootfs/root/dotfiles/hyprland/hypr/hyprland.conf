# ══════════════════════════════════════════════════════════════
# AnnaX — Hyprland Config — Catppuccin Mocha
# ══════════════════════════════════════════════════════════════

# ── Moniteurs ─────────────────────────────────────────────────
monitor=,preferred,auto,1

# ── Programmes par défaut ─────────────────────────────────────
$terminal   = kitty
$filemanager = thunar
$menu       = wofi --show drun
$browser    = firefox
$editor     = code

# ── Autostart ─────────────────────────────────────────────────
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = dunst
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator

# ── Variables d'environnement ─────────────────────────────────
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Catppuccin-Mocha-Dark
env = QT_QPA_PLATFORM,wayland
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ── Apparence ─────────────────────────────────────────────────
general {
    gaps_in          = 5
    gaps_out         = 12
    border_size      = 2
    col.active_border   = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(313244aa)
    layout           = dwindle
    resize_on_border = true
}

decoration {
    rounding        = 12
    active_opacity  = 1.0
    inactive_opacity = 0.92

    blur {
        enabled    = true
        size       = 8
        passes     = 3
        xray       = false
        noise      = 0.01
        contrast   = 0.9
        brightness = 0.8
        vibrancy   = 0.1696
    }

    shadow {
        enabled      = true
        range        = 20
        render_power = 3
        color        = rgba(1e1e2eee)
        color_inactive = rgba(1e1e2e88)
    }
}

animations {
    enabled = true

    bezier = overshot,   0.05, 0.9, 0.1, 1.05
    bezier = smoothOut,  0.5, 0, 0.99, 0.99
    bezier = smoothIn,   0.5, -0.5, 0.68, 1.5
    bezier = wind,       0.05, 0.9, 0.1, 1.05
    bezier = winIn,      0.1, 1.1, 0.1, 1.1
    bezier = winOut,     0.3, -0.3, 0, 1
    bezier = liner,      1, 1, 1, 1

    animation = windows,     1, 6,  wind,     slide
    animation = windowsIn,   1, 6,  winIn,    slide
    animation = windowsOut,  1, 5,  winOut,   slide
    animation = windowsMove, 1, 5,  wind,     slide
    animation = border,      1, 1,  liner
    animation = fade,        1, 10, smoothIn
    animation = fadeDim,     1, 10, smoothIn
    animation = workspaces,  1, 5,  overshot, slidevert
}

dwindle {
    pseudotile      = true
    preserve_split  = true
    smart_split     = false
    smart_resizing  = true
}

master {
    new_status = slave
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
    animate_manual_resizes   = true
}

input {
    kb_layout    = fr
    kb_variant   =
    kb_options   = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll    = true
        disable_while_typing = true
        tap-to-click      = true
        drag_lock         = true
    }
}

# ── Règles de fenêtres ────────────────────────────────────────
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, class:^(thunar)$, title:^(File Operation Progress)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin,   title:^(Picture-in-Picture)$
windowrulev2 = opacity 0.85 0.75, class:^(kitty)$
windowrulev2 = opacity 0.9 0.8,   class:^(Code)$

# Wofi flottant centré
windowrulev2 = float,  class:^(wofi)$
windowrulev2 = center, class:^(wofi)$

# Hyprlock
windowrulev2 = fullscreen, class:^(hyprlock)$

# ── Keybindings ───────────────────────────────────────────────
$mod = SUPER

# Essentiels
bind = $mod, Return,      exec, $terminal
bind = $mod, E,           exec, $filemanager
bind = $mod, B,           exec, $browser
bind = $mod, Space,       exec, $menu
bind = $mod SHIFT, Q,     killactive
bind = $mod SHIFT, E,     exec, wlogout
bind = $mod, F,           fullscreen, 0
bind = $mod SHIFT, F,     fullscreen, 1
bind = $mod, V,           togglefloating
bind = $mod, P,           pseudo
bind = $mod, J,           togglesplit

# Screenshots
bind = , Print,           exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print,      exec, grim - | swappy -f -
bind = $mod, Print,       exec, grim -g "$(slurp)" - | wl-copy

# Clipboard
bind = $mod, C,           exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Luminosité
bind = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Volume
bind = , XF86AudioRaiseVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume,  exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute,         exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute,      exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Média
bind = , XF86AudioPlay,   exec, playerctl play-pause
bind = , XF86AudioNext,   exec, playerctl next
bind = , XF86AudioPrev,   exec, playerctl previous

# Focus déplacement
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Déplacer fenêtres
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Redimensionner
bind = $mod CTRL, left,  resizeactive, -30 0
bind = $mod CTRL, right, resizeactive, 30 0
bind = $mod CTRL, up,    resizeactive, 0 -30
bind = $mod CTRL, down,  resizeactive, 0 30

# Workspaces 1-9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Envoyer sur workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Scroll sur workspaces
bind = $mod, mouse_down, workspace, e-1
bind = $mod, mouse_up,   workspace, e+1

# Déplacer avec souris
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Verrouillage
bind = $mod SHIFT, L, exec, hyprlock
